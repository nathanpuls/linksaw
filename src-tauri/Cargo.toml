[package]
name = "linksaw-snippets"
version = "0.1.1"
description = "A private cross-platform snippet launcher"
authors = ["Nathan Puls"]
edition = "2021"

[lib]
name = "linksaw_snippets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
arboard = "3"
enigo = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
core-graphics = "0.25"
core-foundation = "0.10"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
strip = true
