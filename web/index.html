<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linksaw — Cut to the Paste</title>
  <meta name="description" content="Linksaw keeps your reusable snippets close and easy to copy on Mac and the web.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://linksaw.com/">
  <link rel="icon" href="/app/favicon.png?v=20260923-1" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/app/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Linksaw">
  <meta property="og:title" content="Linksaw — Cut to the Paste">
  <meta property="og:description" content="Linksaw keeps your reusable snippets close and easy to copy on Mac and the web.">
  <meta property="og:url" content="https://linksaw.com/">
  <meta property="og:image" content="https://linksaw.com/icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: #fff;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .hero {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo { width: 108px; height: 108px; display: block; margin-bottom: 30px; }
    h1 { margin: 0; font-size: 42px; line-height: 1; letter-spacing: -1.8px; font-weight: 650; }
    .tagline { margin-top: 25px; color: #777b84; font-size: 13px; font-weight: 500; letter-spacing: .32em; }
    .description { margin: 46px auto 0; color: #555; font-size: 18px; line-height: 1.65; }
    .login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 42px;
      padding: 12px 19px;
      border: 1px solid #d8d8d8;
      border-radius: 999px;
      background: #fff;
      color: #171717;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s ease;
    }
    .login:hover { background: #f5f5f3; }
    .login:focus-visible { outline: 2px solid #171717; outline-offset: 3px; }
    @media (max-width: 600px) {
      main { padding: 36px 20px; }
      .logo { width: 96px; height: 96px; }
      h1 { font-size: 36px; }
      .tagline { font-size: 12px; letter-spacing: .27em; }
      .description { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="linksaw-title">
      <img class="logo" src="/icon.png" alt="Linksaw">
      <h1 id="linksaw-title">Linksaw</h1>
      <div class="tagline">CUT TO THE PASTE</div>
      <p class="description">Snippets, notes, and links</p>
      <a class="login" href="/login">Continue with Google</a>
    </section>
  </main>
</body>
</html>
